# Shop gateway: serves the live site (deployed by the agent) and the admin page,
# and routes API calls to the order-api and agent services.
server {
    listen 80;
    server_name _;
    add_header Cache-Control "no-store" always;
    # Relative redirects: behind a port mapping (8080:80) an absolute redirect would drop the :8080.
    absolute_redirect off;

    # Vendor ordering API + customer error reports
    location ~ ^/api/(cart|checkout|telemetry) {
        proxy_pass http://order-api:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Admin API (state, fault switch, health check, agent)
    location ~ ^/api/(state|admin) {
        proxy_pass http://agent:8002;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /admin { alias /srv/admin/index.html; default_type text/html; }
    location /admin/ {
        alias /srv/admin/;
        index index.html;
    }

    # The live shop: whatever the agent last deployed into /srv/live
    location / {
        root /srv/live;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
